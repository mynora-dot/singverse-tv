name: singverse-tv
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: make build release-check
  release:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Check version and immutable release assets
        run: python3 scripts/validate-release.py
      - name: Restore durable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SINGVERSE_TV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/singverse-tv.jks"
          chmod 600 "$RUNNER_TEMP/singverse-tv.jks"
      - name: Build signed APK and verify release metadata
        env:
          SINGVERSE_TV_KEYSTORE: ${{ runner.temp }}/singverse-tv.jks
          SINGVERSE_TV_STORE_PASSWORD: ${{ secrets.SINGVERSE_TV_STORE_PASSWORD }}
          SINGVERSE_TV_KEY_ALIAS: ${{ secrets.SINGVERSE_TV_KEY_ALIAS }}
          SINGVERSE_TV_KEY_PASSWORD: ${{ secrets.SINGVERSE_TV_KEY_PASSWORD }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: make release
      - name: Upload verified immutable assets
        run: python3 scripts/validate-release.py --assets app/build/tv-release --upload
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/singverse-tv.jks"
