name: singverse-tv
on:
  release:
    types: [published]
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}
concurrency:
  group: singverse-tv-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  release:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set version from Release tag
        run: python3 scripts/build_version.py --github-env
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Check version and immutable release assets
        run: python3 scripts/validate-release.py
      - name: Restore durable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SINGVERSE_TV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/singverse-tv.jks"
          chmod 600 "$RUNNER_TEMP/singverse-tv.jks"
      - name: Build signed ARMv7, ARM64, x86 and x86_64 APKs
        env:
          SINGVERSE_TV_KEYSTORE: ${{ runner.temp }}/singverse-tv.jks
          SINGVERSE_TV_STORE_PASSWORD: ${{ secrets.SINGVERSE_TV_STORE_PASSWORD }}
          SINGVERSE_TV_KEY_ALIAS: ${{ secrets.SINGVERSE_TV_KEY_ALIAS }}
          SINGVERSE_TV_KEY_PASSWORD: ${{ secrets.SINGVERSE_TV_KEY_PASSWORD }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: ./gradlew --no-daemon --build-cache -PsingverseSignRelease=true prepareTvRelease
      - name: Upload per-ABI APKs and immutable release index
        run: python3 scripts/validate-release.py --assets app/build/tv-release --upload
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/singverse-tv.jks"
