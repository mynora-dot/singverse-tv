name: SingVerse 电视端 APK 发布
run-name: 发布电视端 APK ${{ github.event.release.tag_name }}
on:
  release:
    types: [published]
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}
concurrency:
  group: singverse-tv-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  release:
    name: 构建并上传签名电视安装包
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: 检出发布标签对应的源码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: 从发布标签读取版本号
        run: python3 scripts/build_version.py --github-env
      - name: 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 安装 Android SDK 和构建工具
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: 配置 Gradle 与缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: 校验正式发布版本和已有附件
        run: python3 scripts/validate-release.py
      - name: 还原电视端正式签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.SINGVERSE_TV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/singverse-tv.jks"
          chmod 600 "$RUNNER_TEMP/singverse-tv.jks"
      - name: 构建并签署 ARMv7、ARM64、x86 和 x86_64 安装包
        env:
          SINGVERSE_TV_KEYSTORE: ${{ runner.temp }}/singverse-tv.jks
          SINGVERSE_TV_STORE_PASSWORD: ${{ secrets.SINGVERSE_TV_STORE_PASSWORD }}
          SINGVERSE_TV_KEY_ALIAS: ${{ secrets.SINGVERSE_TV_KEY_ALIAS }}
          SINGVERSE_TV_KEY_PASSWORD: ${{ secrets.SINGVERSE_TV_KEY_PASSWORD }}
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: ./gradlew --no-daemon --build-cache -PsingverseSignRelease=true prepareTvRelease
      - name: 上传各架构 APK、版本清单和校验文件
        run: python3 scripts/validate-release.py --assets app/build/tv-release --upload
      - name: 删除临时签名密钥
        if: always()
        run: rm -f "$RUNNER_TEMP/singverse-tv.jks"
